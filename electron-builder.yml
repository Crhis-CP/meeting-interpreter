appId: io.github.crhis-cp.meetinginterpreter
productName: MeetingInterpreter
copyright: Copyright © 2026 Chirs Codex
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
  # Local AI translation runs on the CPU (Metal on Apple silicon): leave out the large CUDA /
  # Vulkan builds of llama.cpp, and its source/cmake tree (never compiled on users' computers).
  - "!node_modules/@node-llama-cpp/*-cuda*/**"
  - "!node_modules/@node-llama-cpp/*-vulkan/**"
  - "!node_modules/@node-llama-cpp/linux-armv7l/**"
  - "!node_modules/node-llama-cpp/llama/llama.cpp/**"
  - "!node_modules/node-llama-cpp/llama/gitRelease.bundle"
asarUnpack:
  # Native recogniser and its shared libraries must live outside the asar archive.
  - node_modules/sherpa-onnx-*/**
  - node_modules/sherpa-onnx-node/**
  # Native llama.cpp (local AI translation), likewise.
  - node_modules/node-llama-cpp/**
  - node_modules/@node-llama-cpp/**
afterPack: build/after-pack.cjs
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  icon: build/icon.png
  # No paid Apple developer account: skip electron-builder signing; after-pack.cjs signs ad hoc.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  darkModeSupport: true
  extendInfo:
    CFBundleDisplayName: 会议同传助手
    NSMicrophoneUsageDescription: 会议同传需要使用麦克风来识别你说的话。
    NSAudioCaptureUsageDescription: 采集会议软件播放的声音，用来翻译对方的发言。
    NSScreenCaptureUsageDescription: 录制会议画面（可选），以及采集系统声音。
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 会议同传助手
  differentialPackage: false
  # Asks on uninstall whether to remove the models and settings too (see the file).
  include: build/installer.nsh
linux:
  target:
    - AppImage
  category: Office
  icon: build/icon.png
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
publish: null
# Electron fuses are set in build/after-pack.cjs, before the macOS ad-hoc signature (not with
# electron-builder's `electronFuses`, which flips them after the hook and breaks the signature).

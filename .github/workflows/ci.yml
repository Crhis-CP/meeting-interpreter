name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure the Electron binary is downloaded
        run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build the Chrome extension and the phone app's web part
        run: node scripts/build-extension.mjs && node scripts/build-mobile.mjs
      - name: Install Chromium for the phone-room test
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Electron under Xvfb)
        run: xvfb-run -a npx playwright test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android app compiles
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore

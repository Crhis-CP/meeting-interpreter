name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure the Electron binary is downloaded
        run: node node_modules/electron/install.js
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build the Chrome extension and the phone app's web part
        run: node scripts/build-extension.mjs && node scripts/build-mobile.mjs
      - name: Install Chromium for the phone-room test
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Electron under Xvfb)
        run: xvfb-run -a npx playwright test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle wrapper is the official one
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Android app compiles
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/
          if-no-files-found: ignore

  desktop-os:
    # What the Linux job cannot reach: the AI translation process (utilityProcess + llama.cpp),
    # the computer's own voices (incl. the long-running Windows speech process), and the desktop
    # app end to end, on real Mac and Windows machines.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure the Electron binary is downloaded
        run: node node_modules/electron/install.js
      - name: Unit tests, with this computer's real voices
        env:
          MI_REAL_VOICES: '1'
        run: npm test
      - run: npm run build
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ai-model
          key: hy-mt2-1.8b-dc5f44fcf1fa496e
      - name: AI translation model (pinned commit, SHA-256 checked)
        shell: bash
        run: echo "MI_AI_MODEL=$(npx tsx --tsconfig tsconfig.node.json scripts/dev/fetch-ai-model.mts ai-model)" >> "$GITHUB_ENV"
      - name: Desktop app end to end, including the real AI model
        run: npx playwright test e2e/app.spec.ts e2e/buttons.spec.ts e2e/devices.spec.ts e2e/profile.spec.ts e2e/restart.spec.ts e2e/local-ai.spec.ts --trace off
      - name: The packaged app (security fuses on, as installed) holds a meeting and translates
        if: always()
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then npx electron-builder --mac --arm64 --dir --publish never; else npx electron-builder --win --x64 --dir --publish never; fi
          bash scripts/test-packaged.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

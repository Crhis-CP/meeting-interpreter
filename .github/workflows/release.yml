name: Release

# Builds installers for macOS, Windows and Linux and publishes them on the Releases page.
# Runs when the version in package.json changes on main (the tag vX.Y.Z is created here),
# when a tag v* is pushed, or by hand (Actions › Release › Run workflow).
on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the publishing job can write (and attest) — see its permissions.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: v
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; building only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --mac --arm64
          - name: macOS (Intel)
            os: macos-15-intel
            args: --mac --x64
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure the Electron binary is downloaded
        run: node node_modules/electron/install.js
      - name: Unit tests (informational; CI on Linux is the gate)
        run: npm test
        continue-on-error: true
      - run: npm run build
      - name: Fixed signing certificate (macOS keeps its permissions across updates)
        if: runner.os == 'macOS'
        env:
          MI_MAC_CERT_P12: ${{ secrets.MI_MAC_CERT_P12 }}
          MI_MAC_CERT_PASSWORD: ${{ secrets.MI_MAC_CERT_PASSWORD }}
        run: bash scripts/mac-signing.sh
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ai-model
          key: hy-mt2-1.8b-dc5f44fcf1fa496e
      - name: AI translation model for the test below (pinned commit, SHA-256 checked)
        shell: bash
        run: echo "MI_AI_MODEL=$(npx tsx --tsconfig tsconfig.node.json scripts/dev/fetch-ai-model.mts ai-model)" >> "$GITHUB_ENV"
      - name: The packaged app holds a meeting and translates with the AI model (before publishing)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            command -v xvfb-run >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq xvfb; }
            xvfb-run -a bash scripts/test-packaged.sh
          else
            bash scripts/test-packaged.sh
          fi
      - name: Chrome extension
        if: runner.os == 'Linux'
        run: node scripts/build-extension.mjs --zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  android:
    needs: version
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
      - name: Build the app's web part
        run: node scripts/build-mobile.mjs
      - name: Gradle wrapper is the official one
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Private signing key (only when the repository has one in its secrets)
        env:
          KEYSTORE_B64: ${{ secrets.MI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MI_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No private signing key: the APK is signed with the public community key"
          fi
      - name: Build the APK
        working-directory: android
        env:
          MI_KEYSTORE_PASSWORD: ${{ secrets.MI_KEYSTORE_PASSWORD }}
          MI_KEY_ALIAS: ${{ secrets.MI_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Name it
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/meeting-interpreter-android-$(node -p "require('./package.json').version").apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-android
          path: release/*.apk
          if-no-files-found: error

  publish:
    # Only when every installer was built: a release missing one platform would send that
    # platform's users from the website to a page without their download.
    needs: [version, build, android]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -la
          test -n "$(ls)"
          sha256sum * > SHA256SUMS.txt
      - name: Build provenance (anyone can check a download with `gh attestation verify FILE --repo ${{ github.repository }}`)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Release notes
        run: |
          python3 - "${{ needs.version.outputs.tag }}" <<'PY'
          import re, sys
          version = sys.argv[1].lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[?v?' + re.escape(version) + r'\]?.*?$(.*?)(?=^## |\Z)', text, re.S | re.M)
          body = (m.group(1).strip() if m else '') + '\n\n' + open('docs/release-footer.md', encoding='utf-8').read()
          open('notes.md', 'w', encoding='utf-8').write(body)
          PY
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 会议同传助手 ${{ needs.version.outputs.tag }}
          body_path: notes.md
          files: dist/*
          draft: false
          prerelease: false
          make_latest: true

  verify:
    # Downloads what was just published and runs the end-to-end tests against those very files.
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npx playwright install --with-deps chromium
      - name: Test the released files
        env:
          GH_TOKEN: ${{ github.token }}
        run: xvfb-run -a bash scripts/smoke-release.sh

name: Release

# Builds installers for macOS, Windows and Linux and publishes them on the Releases page.
# Runs when the version in package.json changes on main (the tag vX.Y.Z is created here),
# when a tag v* is pushed, or by hand (Actions › Release › Run workflow).
on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; building only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --mac --arm64
          - name: macOS (Intel)
            os: macos-15-intel
            args: --mac --x64
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure the Electron binary is downloaded
        run: node node_modules/electron/install.js
      - name: Unit tests (informational; CI on Linux is the gate)
        run: npm test
        continue-on-error: true
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Chrome extension
        if: runner.os == 'Linux'
        run: node scripts/build-extension.mjs --zip
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  android:
    needs: version
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --ignore-scripts
      - name: Build the app's web part
        run: node scripts/build-mobile.mjs
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Name it
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/meeting-interpreter-android-$(node -p "require('./package.json').version").apk"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-android
          path: release/*.apk
          if-no-files-found: error

  publish:
    needs: [version, build, android]
    if: always() && needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -la
          test -n "$(ls)"
          sha256sum * > SHA256SUMS.txt
      - name: Release notes
        run: |
          python3 - "${{ needs.version.outputs.tag }}" <<'PY'
          import re, sys
          version = sys.argv[1].lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[?v?' + re.escape(version) + r'\]?.*?$(.*?)(?=^## |\Z)', text, re.S | re.M)
          body = (m.group(1).strip() if m else '') + '\n\n' + open('docs/release-footer.md', encoding='utf-8').read()
          open('notes.md', 'w', encoding='utf-8').write(body)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 会议同传助手 ${{ needs.version.outputs.tag }}
          body_path: notes.md
          files: dist/*
          draft: false
          prerelease: false
          make_latest: true

  verify:
    # Downloads what was just published and runs the end-to-end tests against those very files.
    needs: [version, publish]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npx playwright install --with-deps chromium
      - name: Test the released files
        run: xvfb-run -a bash scripts/smoke-release.sh

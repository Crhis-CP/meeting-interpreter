name: Release

# Push a tag like v0.1.0 to build installers for macOS, Windows and Linux and publish them on the
# GitHub Releases page. Can also be started by hand (Actions › Release › Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0); leave empty to only build'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --mac --arm64
          - name: macOS (Intel)
            os: macos-15-intel
            args: --mac --x64
          - name: Windows
            os: windows-latest
            args: --win --x64
          - name: Linux
            os: ubuntu-latest
            args: --linux --x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make sure the Electron binary is downloaded
        run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  publish:
    needs: build
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum * > SHA256SUMS.txt
      - name: Release notes
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1].lstrip('v')
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[?v?' + re.escape(version) + r'\]?.*?$(.*?)(?=^## |\Z)', text, re.S | re.M)
          body = (m.group(1).strip() if m else '') + '\n\n' + open('docs/release-footer.md', encoding='utf-8').read()
          open('notes.md', 'w', encoding='utf-8').write(body)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 会议同传助手 ${{ github.event.inputs.tag || github.ref_name }}
          body_path: notes.md
          files: dist/*
          draft: false
          prerelease: false
